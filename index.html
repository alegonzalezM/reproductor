<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="public/music-192.png" />
<link rel="apple-touch-icon" href="public/music-192.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content=	"#8DB600" />   
</head>
<body>
  <div class="player">
    <input type="file" id="fileInput" accept="audio/*,video/*" multiple hidden />   
    
    <button id="btnAdd" class="btn-add">📂 Agregar canciones</button>

    <div class="track-info">
      <p id="trackName">Seleccioná una canción</p>
      <p id="trackCount"></p>
    </div>
<video id="videoPlayer" style="display:none; width:100%; max-width:640px;"></video>
    <div class="progress-container" id="progressBar">
      <div class="progress" id="progress"></div>
    </div>
    <div class="times">
      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>

    <div class="controls">
      <button id="btnPrev">⏮</button>
      <button id="btnPlay" class="btn-play">▶</button>
      <button id="btnNext">⏭</button>
    </div>

<div class="playlist-controls">
  <input type="text" id="playlistName" placeholder="Nombre de la lista" />
  <button id="btnCreate">➕ Crear lista</button>
</div>
   
<div class="playlist-controls">
  <input type="text" id="playlistName" placeholder="Nombre de la lista" />
  <button id="btnCreate">➕ Crear lista</button>
</div>

<!-- ← FALTABA ESTE -->
<div class="playlists" id="playlists"></div>

<div class="playlist" id="playlist"></div>   

    <div class="playlist" id="playlist"></div>
  </div>

  <script src="reproductor.js"></script>
</body>
</html>
